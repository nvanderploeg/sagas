services:
  app:
    image: ghcr.io/nvanderploeg/sagas:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - '127.0.0.1:${SAGAS_PORT:-3290}:3000'
    environment:
      # postgres://user:pw@host:5432/sagas?sslmode=verify-full; hex password (see deploy/README.md).
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
      SAGAS_IMPORT_MAX_BYTES: ${SAGAS_IMPORT_MAX_BYTES:-209715200}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?set ADMIN_EMAILS in .env}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:?set FIREBASE_WEB_API_KEY in .env}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      FIREBASE_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-service-account.json
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_HOST_PATH:?set FIREBASE_SERVICE_ACCOUNT_HOST_PATH in .env}:/run/secrets/firebase-service-account.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
