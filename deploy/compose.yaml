services:
  db:
    image: postgres:16
    restart: unless-stopped
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=50']
    environment:
      POSTGRES_DB: sagas
      POSTGRES_USER: sagas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sagas -d sagas']
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    image: ghcr.io/nvanderploeg/sagas:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${SAGAS_PORT:-3290}:3000'
    environment:
      # An external Postgres over TLS: replace with
      # postgres://user:pw@host:5432/sagas?sslmode=verify-full (see deploy/README.md).
      DATABASE_URL: postgres://sagas:${POSTGRES_PASSWORD}@db:5432/sagas
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
      SAGAS_IMPORT_MAX_BYTES: ${SAGAS_IMPORT_MAX_BYTES:-209715200}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?set ADMIN_EMAILS in .env}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:?set FIREBASE_WEB_API_KEY in .env}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      FIREBASE_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-service-account.json
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:?set FIREBASE_SERVICE_ACCOUNT_PATH in .env}:/run/secrets/firebase-service-account.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  pgdata:
