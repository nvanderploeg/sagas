<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Realm board</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #ffffff;
				--card: #f4f4f5;
				--fg: #18181b;
				--muted: #71717a;
				--line: #e4e4e7;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #18181b;
					--card: #27272a;
					--fg: #fafafa;
					--muted: #a1a1aa;
					--line: #3f3f46;
				}
			}
			body {
				margin: 0;
				padding: 12px;
				background: var(--bg);
				color: var(--fg);
				font:
					13px/1.4 system-ui,
					sans-serif;
			}
			h1 {
				margin: 0 0 10px;
				font-size: 15px;
			}
			h1 a {
				color: inherit;
			}
			.board {
				display: flex;
				gap: 10px;
				overflow-x: auto;
				align-items: flex-start;
			}
			.column {
				flex: 0 0 220px;
				border-top: 3px solid var(--line);
			}
			.column h2 {
				margin: 6px 0;
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				color: var(--muted);
			}
			.card {
				display: block;
				margin-bottom: 6px;
				padding: 8px;
				border-radius: 6px;
				background: var(--card);
				color: inherit;
				text-decoration: none;
			}
			.key {
				font-size: 11px;
				color: var(--muted);
			}
			.meta {
				margin-top: 4px;
				font-size: 11px;
				color: var(--muted);
			}
			.note {
				color: var(--muted);
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<div id="root"><p class="note">Loading board…</p></div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
